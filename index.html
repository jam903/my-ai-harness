<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metacognition Harness</title>
  </head>
  <body>
    <header class="bar">
      <h1>Metacognition Harness</h1>
      <div id="key-area" class="key-area"></div>
    </header>

    <section class="controls">
      <label for="model">Model</label>
      <input id="model" list="model-list" autocomplete="off" spellcheck="false" />
      <datalist id="model-list"></datalist>
      <button id="new-chat" type="button">New chat</button>
    </section>

    <main id="messages" class="messages" aria-live="polite"></main>

    <form id="composer" class="composer">
      <textarea id="input" rows="3" placeholder="Type a message — Enter to send, Shift+Enter for a newline"></textarea>
      <button id="send" type="submit">Send</button>
    </form>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
